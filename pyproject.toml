[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "woosh"
version = "0.2.2"
description = "Woosh Sound Effect Foundation model (Sony AI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
# license-files = ["LICEN[CS]E*"]
keywords = ["genai", "flow matching", "sound", "sfx"]
dependencies = [
  "einops>=0.8.1",
  "hydra-core>=1.3.2",
  "lightning>=2.5.6",
  "timm>=1.0.22",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchdiffeq>=0.2.5",
  "transformers==4.57.3",
  "hear21passt==0.0.26",
  "pydantic>=2.12.4",
  "omegaconf>=2.3.0",
  "av>=16.1.0",
  "requests",
  "gradio>=6.9.0",
]
[project.optional-dependencies]
# cpu = ["torch==2.8.0", "torchvision==0.23.0", "torchaudio==2.8.0"]
# cuda = ["torch==2.8.0", "torchvision==0.23.0", "torchaudio==2.8.0"]
cpu = ["torch", "torchvision", "torchaudio"]
cuda = ["torch", "torchvision", "torchaudio"]

[tool.uv]
environments = [
  "sys_platform == 'win32'",
]
override-dependencies = [
  "transformers==4.57.3",
]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]
# to avoid installing dependencies like:
# pip install hear21passt --no-dependencies
dependency-metadata = [
  { name = "hear21passt", version = "0.0.26", requires-dist = [
  ] },
]
default-groups = "all"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]
heartlib = { git = "https://github.com/HeartMuLa/heartlib.git", rev = "3783bdb8441f2c298b1e64c8651173aac200361c" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
api = ["fastapi>=0.124.4", "uvicorn>=0.38.0"]
studio = [
    "ctranslate2==4.6.0",
    "fastapi>=0.124.4",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pedalboard>=0.9.19",
    "python-multipart>=0.0.20",
    "sentencepiece>=0.2.0",
    "setuptools==80.9.0",
    "soundfile>=0.13.1",
    "uvicorn>=0.38.0",
]
music = [
    "accelerate==1.12.0",
    "demucs==4.1.0",
    "heartlib",
    "mmgp==3.7.10",
    "numpy==2.0.2",
    "tokenizers==0.22.1",
    "torchao==0.9.0",
    "torchtune==0.4.0",
]
speech = [
    "qwen-tts==0.1.1",
]
reaper = [
    "httpx>=0.28.1",
    "python-reapy>=0.10.0",
]
audioio = ["soundfile>=0.13.1"]
demo = ["gradio>=6"]
dev = [
    "ipykernel",
    "ipython",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.14.6",
]

[project.scripts]
woosh-studio-api = "woosh_studio.main:run"

[tool.hatch.build.targets.wheel]
packages = ["woosh", "woosh_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
